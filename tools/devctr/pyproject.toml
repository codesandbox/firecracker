[tool.poetry]
name = "tool.poetry"
version = "0.1.0"
description = "Firecracker python dependencies"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
aiohttp = "^3.14.4"
aws-embedded-metrics = "^3.1.0"
black = "^26.3.1"
# Gitlint locks this to 8.1.3. Lock from our side too to prevent different versions
click = "8.1.3"
# Use gitlint-core without the "trusted-deps" extra, which pins sh to a vulnerable 1.14.3
gitlint-core = "^0.19.1"
idna = "^3.15"
ipython = "^8.15.0"
isort = "^5.12.0"
nsenter = "^0.2"
# numpy >1.25.0,<=1.25.2 trigger an illegal instruction on AL2 4.14 on c7g.metal instances, due to these instances
# not advertising SVE support. See https://github.com/numpy/numpy/issues/24028
numpy = "1.24.3"
openapi-spec-validator = "^0.5.6"
pandas = "^2.0.1"
psutil = "^5.9.5"
pylint = "^2.17.4"
pytest = "^7.3.1"
pytest-json-report = "^1.5.0"
pytest-rerunfailures = "^11.1.2"
pytest-timeout = "^2.1.0"
pytest-xdist = "^3.3.1"
python = "3.10.*"
PyYAML = "^6.0"
requests = "^2.32.4"
requests-unixsocket = "^0.4.1"
retry = "^0.9.2"
scipy = "^1.11.2"
setproctitle = "^1.3.2"
sh = "^2.2.4"
tenacity = "^8.2.2"
urllib3 = "^2.8.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
